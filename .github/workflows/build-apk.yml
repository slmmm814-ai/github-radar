name: build-apk
on:
  push:
    branches: [main]
    paths-ignore:
      - "radar-server/**"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: radar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk radar-plus.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest radar-plus.apk --target "${{ github.sha }}" --title "Radar GitHub+ (latest build)" --notes "Debug APK built by GitHub Actions"
